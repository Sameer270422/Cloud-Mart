server:
  port: 8085

spring:
  application:
    name: genai-service

cloudmart:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  services:
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        # An auth failure or bad request (4xx) is not infrastructure
        # flakiness - retrying it wastes calls, and letting it count
        # toward the breaker means one bad API key trips the breaker for
        # every user, turning a config problem into an outage.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      anthropic:
        max-attempts: 2
        wait-duration: 500ms
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
