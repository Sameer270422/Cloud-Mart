server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudmart_orders}
    username: ${DB_USER:cloudmart}
    password: ${DB_PASSWORD:cloudmart}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Don't stamp the producer's fully-qualified class name into Kafka
        # headers - consumers (e.g. notification-service) have their own
        # local copy of the OrderEvent DTO in a different package and would
        # fail to deserialize by type-header lookup. Consumers instead set
        # spring.json.value.default.type to their own local DTO class.
        spring.json.add.type.headers: false

cloudmart:
  kafka:
    order-events-topic: order-events
  services:
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 4xx from product-service (not found, insufficient stock) is a
        # business response, not an infrastructure failure - don't let it
        # trip the breaker.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
