spring:
  datasource:
    url: jdbc:h2:mem:ordertestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

cloudmart:
  kafka:
    order-events-topic: order-events
  services:
    product-service-url: http://localhost:8082
