services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudmart_users
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
    ports:
      - "5433:5432"
    volumes:
      - users_data:/var/lib/postgresql/data

  postgres-products:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudmart_products
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
    ports:
      - "5434:5432"
    volumes:
      - products_data:/var/lib/postgresql/data

  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudmart_orders
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
    ports:
      - "5435:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data

  postgres-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudmart_notifications
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
    ports:
      - "5436:5432"
    volumes:
      - notifications_data:/var/lib/postgresql/data

  # user-service, product-service, order-service, notification-service, and
  # genai-service deliberately have no "ports:" mapping - api-gateway is the
  # only supported entry point now that it enforces JWT auth (see
  # api-gateway's JwtAuthenticationFilter). They're still reachable from
  # each other and from api-gateway over the internal compose network by
  # service name; publishing their ports to the host would let anyone
  # bypass the gateway (and its auth check) entirely by hitting them
  # directly. For local debugging, use `docker compose exec <service> sh`
  # or temporarily add a ports: block back.
  user-service:
    build: ./user-service
    depends_on:
      - postgres-users
    environment:
      DB_URL: jdbc:postgresql://postgres-users:5432/cloudmart_users
      DB_USER: cloudmart
      DB_PASSWORD: cloudmart
      JWT_SECRET: ${JWT_SECRET:-cloudmart-super-secret-signing-key-change-me-in-prod-0123456789}

  product-service:
    build: ./product-service
    depends_on:
      - postgres-products
    environment:
      DB_URL: jdbc:postgresql://postgres-products:5432/cloudmart_products
      DB_USER: cloudmart
      DB_PASSWORD: cloudmart

  order-service:
    build: ./order-service
    depends_on:
      - postgres-orders
      - kafka
      - product-service
    environment:
      DB_URL: jdbc:postgresql://postgres-orders:5432/cloudmart_orders
      DB_USER: cloudmart
      DB_PASSWORD: cloudmart
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8082

  notification-service:
    build: ./notification-service
    depends_on:
      - postgres-notifications
      - kafka
    environment:
      DB_URL: jdbc:postgresql://postgres-notifications:5432/cloudmart_notifications
      DB_USER: cloudmart
      DB_PASSWORD: cloudmart
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  genai-service:
    build: ./genai-service
    depends_on:
      - product-service
      - order-service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in a .env file - see README}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083

  api-gateway:
    build: ./api-gateway
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
      - genai-service
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      GENAI_SERVICE_URL: http://genai-service:8085
      JWT_SECRET: ${JWT_SECRET:-cloudmart-super-secret-signing-key-change-me-in-prod-0123456789}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  users_data:
  products_data:
  orders_data:
  notifications_data:
