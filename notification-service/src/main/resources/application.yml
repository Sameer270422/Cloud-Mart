server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudmart_notifications}
    username: ${DB_USER:cloudmart}
    password: ${DB_PASSWORD:cloudmart}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      # Deserializer failures (malformed payloads, schema drift) are wrapped
      # by ErrorHandlingDeserializer instead of thrown raw - a raw throw
      # from the delegate deserializer kills the poll loop and gets stuck
      # retrying the same offset forever ("poison pill"). Wrapped, the
      # failure surfaces as a normal per-record error the DefaultErrorHandler
      # bean (see KafkaConsumerConfig) can retry and eventually dead-letter.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.cloudmart.notification.dto.OrderEvent
        spring.json.use.type.headers: false

cloudmart:
  kafka:
    order-events-topic: order-events

management:
  endpoints:
    web:
      exposure:
        include: health,info
