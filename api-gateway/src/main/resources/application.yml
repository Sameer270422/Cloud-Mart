server:
  port: 8080

jwt:
  # Must match user-service's jwt.secret - the gateway verifies tokens
  # user-service issued, so both need the same signing key.
  secret: ${JWT_SECRET:cloudmart-super-secret-signing-key-change-me-in-prod-0123456789}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**
        - id: genai-service
          uri: ${GENAI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/assistant/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
